version: "3.8"
services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: cadastro-filmes_db
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: cadastro-filmes_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:rw,Z
    depends_on:
      - db

  # Optional: pgAdmin service for database management
  # pgadmin:
  #   image: docker.io/dpage/pgadmin4:latest
  #   container_name: cadastro-filmes_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "8081:80"
  #   depends_on:
  #     - db

volumes:
  db_data: